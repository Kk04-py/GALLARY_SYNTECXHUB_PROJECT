<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickStack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: #fff;
            min-height: 100vh;
        }

        /* Header & Controls */
        .header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #540836);
        }

        .header h1 {
            font-size: 3rem;
            font-family: 'Poppins', 'Arial', sans-serif;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease infinite;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 35px;
            border: none;
            background: linear-gradient(135deg, #39032e3c, #764ba2);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* Search Bar */
        .search-box {
            margin-top: 15px;
        }

        .search-box input {
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #1a1a2e;
            color: #fff;
            width: 250px;
            outline: none;
        }

        /* Masonry Grid */
        .gallery {
            column-count: 4;
            column-gap: 15px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) { .gallery { column-count: 3; } }
        @media (max-width: 800px) { .gallery { column-count: 2; } }
        @media (max-width: 500px) { .gallery { column-count: 1; } }

        .item {
            break-inside: avoid;
            margin-bottom: 15px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            background: #2a2a2a;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .item:hover {
            transform: scale(1.02);
            z-index: 2;
        }

        .item img {
            width: 100%;
            display: block;
            transition: opacity 0.3s ease;
        }

        /* Overlay Info */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .item:hover .overlay { 
            opacity: 1; 
        }

        .overlay h3 { 
            font-size: 16px; 
            margin-bottom: 5px; 
        }

        .overlay span { 
            font-size: 12px; 
            color: #e94560; 
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox.active { 
            display: flex; 
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .lightbox-info {
            position: absolute;
            bottom: 50px;
            text-align: center;
            width: 100%;
        }

        .lightbox-info h2 { 
            font-weight: 300; 
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover { 
            color: #e94560; 
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            color: #fff;
            cursor: pointer;
            padding: 20px;
            transition: color 0.3s;
        }

        .nav-btn:hover { 
            color: #e94560; 
        }

        .prev { 
            left: 30px; 
        }

        .next { 
            right: 30px; 
        }

        @keyframes fadeIn {
            to { 
                opacity: 1; 
            }
        }
    </style>

        let currentIndex = 0;

        // Initialize Gallery
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            filteredImages.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.style.animationDelay = `${index * 0.1}s`;
                item.onclick = () => openLightbox(index);
                
                item.innerHTML = `
                    <img src="${img.src}" alt="${img.title}" loading="lazy">
                    <div class="overlay">
                        <h3>${img.title}</h3>
                        <span>${img.category.toUpperCase()}</span>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }

function filter(category, element) {

    document.querySelectorAll('.btn').forEach(btn => {
        btn.classList.remove('active');
    });

    element.classList.add('active');

    if (category === 'all') {
        filteredImages = [...images];
    } else {
        filteredImages = images.filter(img => img.category === category);
    }

    renderGallery();
}
        // Search Function
        function searchImages() {
            const query = document.getElementById('search').value.toLowerCase();
            const activeCategory = document.querySelector('.btn.active').textContent.toLowerCase();
            
            filteredImages = images.filter(img => {
                const matchesSearch = img.title.toLowerCase().includes(query) || 
                                      img.location.toLowerCase().includes(query);
                const matchesCategory = activeCategory === 'all' || img.category === activeCategory;
                return matchesSearch && matchesCategory;
            });
            
            renderGallery();
        }

        // Lightbox Functions
        function openLightbox(index) {
            currentIndex = index;
            const img = filteredImages[index];
            
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox-title').textContent = img.title;
            
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function changeImage(direction) {
            currentIndex += direction;

            if (currentIndex < 0) {
                currentIndex = filteredImages.length - 1;
            }

            if (currentIndex >= filteredImages.length) {
                currentIndex = 0;
            }

            openLightbox(currentIndex);
        }

        // Click outside image to close
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {

            if (!document.getElementById('lightbox').classList.contains('active')) return;

            if (e.key === 'Escape') closeLightbox();

            if (e.key === 'ArrowLeft') changeImage(-1);

            if (e.key === 'ArrowRight') changeImage(1);
        });

        // Initial Render
        renderGallery();
    </script>
